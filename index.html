<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在装修中</title>
<meta name="description" content="正在装修中，你来这里干什么？">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f4f3f1;
    --fg:#1c1c1e;
    --muted:#9a9893;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:44rem;text-align:center}

  h1{
    margin:0;
    font-size:clamp(1.6rem,5.6vw,3rem);
    font-weight:600;
    line-height:1.45;
    letter-spacing:.01em;
    animation:rise .5s cubic-bezier(.22,1,.36,1) both;
  }
  h1::after{
    content:"";
    display:inline-block;
    width:.085em;
    height:.92em;
    margin-left:.14em;
    background:var(--fg);
    vertical-align:-.08em;
    animation:blink 1.1s steps(1) infinite;
  }

  footer{
    margin-top:clamp(2rem,7vh,4rem);
    font-size:.8125rem;
    color:var(--muted);
    letter-spacing:.02em;
    animation:rise .5s .15s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){
    h1,footer{animation:none}
    h1::after{animation:none}
  }
</style>
</head>
<body>
<main>
  <h1 id="line">正在装修中，你来这里干什么？</h1>
  <footer>这是你第 <span id="n">1</span> 次光临</footer>
</main>

<script>
  // 文案池：想加就往后追加，改完刷新即可生效
  var COPY = [
    "正在装修中，你来这里干什么？",
    "工地重地，闲人免进。说的就是你。",
    "装修中，灰尘有点大，建议戴个口罩再刷新。",
    "这里还什么都没建好，你是第一个来的，荣幸吗？",
    "正在装修中。工人师傅说：再等等。",
    "页面装修中，进度 3%。刷新不会让它变快。",
    "装修中，请勿在此堆放杂物。你的好奇心除外。",
    "正在装修中，预计 2000 年后完工。",
    "你每刷新一次，师傅就得多搬一块砖。",
    "施工重地，请勿围观。你已经在围观了。",
    "装修中，暂时没有内容——不过随机文案也算内容吧。",
    "这里什么都没有，除了这句话和你的好奇心。",
    "正在装修中。你来这里干什么？我也想知道。",
    "抱歉，本页还在装修。要不你先去别处逛逛？",
    "装修中，请勿打扰，除非你带了奶茶。"
  ];

  var KEY_LAST = "uc:last";
  var KEY_N = "uc:n";

  function store(key, val) {
    try { sessionStorage.setItem(key, val); } catch (e) {}
  }
  function load(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }

  // 随机挑一条，且尽量不跟上次重复
  var last = load(KEY_LAST);
  var pool = COPY.filter(function (t) { return t !== last; });
  if (!pool.length) pool = COPY;
  var pick = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById("line").textContent = pick;
  store(KEY_LAST, pick);

  var visits = Number(load(KEY_N) || 0) + 1;
  store(KEY_N, String(visits));
  document.getElementById("n").textContent = String(visits);
</script>
</body>
</html>
