<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在装修中</title>
<meta name="description" content="正在装修中，你来这里干什么？">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3f1">

<!-- 防闪烁：在样式生效前就把已保存的主题贴到 <html> 上，并同步地址栏颜色 -->
<script>
  (function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem("uc:theme"); } catch (e) { saved = null; }
    if (saved !== "light" && saved !== "dark") saved = null;

    var dark = saved ? saved === "dark"
                     : window.matchMedia("(prefers-color-scheme: dark)").matches;

    if (saved) root.setAttribute("data-theme", saved);

    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", dark ? "#1a1917" : "#f4f3f1");
  })();
</script>

<style>
  /* ── 1. 主题变量：浅色为默认，深色由下面两组选择器覆盖 ── */
  :root{
    color-scheme:light;
    --bg:#f4f3f1;
    --fg:#1c1c1e;
    --muted:#6f6d69;            /* 原 #9a9893：对比度仅 2.60:1；调深后 4.66:1，达 WCAG AA */
    --sel-bg:#dedbd4;           /* ::selection 背景 */
    --sel-fg:#1c1c1e;           /* ::selection 文字 */
    --ctl-border:rgba(0,0,0,.44);      /* 切换按钮描边：叠底后 3.19:1 (UI AA) */
    --ctl-bg:rgba(255,255,255,.55);    /* 切换按钮底色（装饰性） */
    --scroll-thumb:#8d8b86;            /* 滚动条滑块：3.07:1 (UI AA) */

    /* ── 动效 token：与主题无关，所以只在这里声明一次，深色块不重复 ── */
    --ease-out:cubic-bezier(0.23,1,0.32,1);      /* 入场 / 退出 / 按压回弹 */
    --ease-in-out:cubic-bezier(0.77,0,0.175,1);  /* 屏上位移 / 配色过渡 */
    --dur-press:160ms;                           /* hover / 按压反馈：100–160ms 预算内 */
    --dur-press-in:110ms;                        /* 按下去：动作已经发生，按钮要立刻跟上 */
    --dur-press-out:200ms;                       /* 松手回落：系统的回应，可以软一点 */
    --dur-enter:240ms;                           /* 入场；240 + 60ms 错开 = 整串正好 300ms */
    --dur-theme:250ms;                           /* 明暗配色交叉淡入（退路 / 减少动效时用） */
    --dur-reveal:400ms;                          /* 主题推开 / 收回：整屏距离，比控件的 300ms 预算长一点 */
  }

  /* ── 2a. 深色：跟随系统偏好 ── */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#1a1917;
      --fg:#ededeb;
      --muted:#85837e;
      --sel-bg:#3b3833;
      --sel-fg:#f4f2ef;
      --ctl-border:rgba(255,255,255,.34);
      --ctl-bg:rgba(255,255,255,.06);
      --scroll-thumb:#7c7a76;
    }
  }

  /* ── 2b. 深色：手动指定（优先级高于系统偏好） ── */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1a1917;
    --fg:#ededeb;
    --muted:#85837e;
    --sel-bg:#3b3833;
    --sel-fg:#f4f2ef;
    --ctl-border:rgba(255,255,255,.34);
    --ctl-bg:rgba(255,255,255,.06);
    --scroll-thumb:#7c7a76;
  }

  /* ── 3. 基础布局（与改造前完全一致） ── */
  *{box-sizing:border-box}
  html,body{height:100%}
  html{
    background:var(--bg);
    scrollbar-color:var(--scroll-thumb) transparent;
    /* 画布本身也要过渡，否则切换主题时 body 之外的边缘会瞬变 */
    transition:background-color var(--dur-theme) var(--ease-in-out);
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8vh 6vw;
    -webkit-font-smoothing:antialiased;
    transition:background-color var(--dur-theme) var(--ease-in-out),
               color var(--dur-theme) var(--ease-in-out);
  }
  main{max-width:44rem;text-align:center}

  h1{
    margin:0;
    font-size:clamp(1.6rem,5.6vw,3rem);
    font-weight:600;
    line-height:1.45;
    letter-spacing:.01em;
    text-wrap:balance;          /* 让两行断得均匀，避免末行只剩一个字 */
    color:var(--fg);
    animation:enter var(--dur-enter) var(--ease-out) both;
    transition:color var(--dur-theme) var(--ease-in-out);
  }
  h1::after{
    content:"";
    display:inline-block;
    width:.085em;
    height:.92em;
    margin-left:.14em;
    background:var(--fg);
    vertical-align:-.08em;
    animation:blink 1.1s steps(1) infinite;
    transition:background-color var(--dur-theme) var(--ease-in-out);
  }

  footer{
    margin-top:clamp(2rem,7vh,4rem);
    font-size:.8125rem;
    color:var(--muted);
    letter-spacing:.02em;
    /* 60ms 错开：先文字后脚注，30–80ms 区间内，不阻塞交互 */
    animation:enter var(--dur-enter) 60ms var(--ease-out) both;
    transition:color var(--dur-theme) var(--ease-in-out);
  }

  /* ── 4. 边界：选中文字 ── */
  ::selection{background:var(--sel-bg);color:var(--sel-fg)}

  /* ── 5. 手动切换按钮：固定定位，不参与居中布局 ── */
  #theme-toggle{
    position:fixed;
    top:clamp(12px,2.4vh,20px);
    right:clamp(12px,2.4vw,20px);
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    padding:0;
    margin:0;
    color:var(--muted);            /* 实色不用半透明，保证 ≥3:1 的控件对比度 */
    background:var(--ctl-bg);
    border:1px solid var(--ctl-border);
    border-radius:50%;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color var(--dur-press) ease,
               background-color var(--dur-theme) var(--ease-in-out),
               border-color var(--dur-theme) var(--ease-in-out),
               transform var(--dur-press-out) var(--ease-out);   /* 松手回落：慢半拍、软一点 */
  }
  /* 命中区扩到 46×46，视觉尺寸仍是 34px（触屏最小目标 44px） */
  #theme-toggle::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
  }
  /* 按压反馈：pointerdown 即触发，不等 release。
     两侧故意不同速 —— 按下 110ms（你的手已经按下去了，按钮必须立刻跟上），
     松手 200ms（按钮回到原位是系统在回应你，可以软一点）。
     两侧同速会让这个小圆钮按起来像在犹豫。transition-duration 按 transition-property 的顺序逐个对应。 */
  #theme-toggle:active{
    transform:scale(.94);
    transition-duration:var(--dur-press), var(--dur-theme), var(--dur-theme), var(--dur-press-in);
  }
  #theme-toggle:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  #theme-toggle svg{display:block}

  /* hover 只在真有指针的设备上生效，触屏点按不会误触发并粘住 */
  @media (hover:hover) and (pointer:fine){
    #theme-toggle:hover{color:var(--fg)}
  }

  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

  /* ── 6. 减少动效：更轻，而不是归零。保留透明度与颜色（有助理解状态变化），去掉位移与缩放 ── */
  @media (prefers-reduced-motion:reduce){
    h1{animation:fade 160ms var(--ease-out) both}
    footer{animation:fade 160ms 40ms var(--ease-out) both}
    h1::after{animation:none}          /* 光标停止闪烁，保留为静态插入符 */
    #theme-toggle{transition:color var(--dur-press) ease,
                              background-color var(--dur-theme) var(--ease-in-out),
                              border-color var(--dur-theme) var(--ease-in-out)}
    #theme-toggle:active{transform:none}      /* 连按下的缩放也去掉 */
  }

  /* ── 7. 边界：降透明度偏好 → 按钮改实色，不用半透明表面 ── */
  @media (prefers-reduced-transparency:reduce){
    #theme-toggle{background:var(--bg)}
  }

  /* ── 8. 边界：高对比偏好 → 提高次要与描边对比度 ── */
  @media (prefers-contrast:more){
    :root{--muted:#3f3d3a;--ctl-border:rgba(0,0,0,.9);--scroll-thumb:#5c5a56;--sel-bg:#cfcbc3}
  }
  @media (prefers-contrast:more) and (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--muted:#c3c1bd;--ctl-border:rgba(255,255,255,.85);--scroll-thumb:#a8a6a2;--sel-bg:#4d4a44}
  }
  @media (prefers-contrast:more){
    :root[data-theme="dark"]{--muted:#c3c1bd;--ctl-border:rgba(255,255,255,.85);--scroll-thumb:#a8a6a2;--sel-bg:#4d4a44}
  }

  /* ── 9. 主题切换：暗色从按钮处「推开」，切回亮色时沿原路「收回」 ──
     走 View Transitions：新旧两帧由浏览器各拍一张快照，所以文字颜色是在圆周那道边界上
     跟着一起翻的，而不是「先被盖住、再整页突然变色」。圆心 = 按钮中心，半径 = 到最远那个角。
     不支持 View Transitions 的浏览器自动退回原来的配色交叉淡入（第 3 节的 transition）。 */
  ::view-transition-old(root),
  ::view-transition-new(root){animation:none;mix-blend-mode:normal}

  /* 变暗：新帧（暗）从按钮处推开，盖住旧帧（亮） */
  html[data-vt="in"]::view-transition-new(root){
    animation:vt-push var(--dur-reveal) var(--ease-out) both;
  }
  /* 变亮：旧帧（暗）沿原路收回按钮里，露出下面一直没动过的新帧（亮）。
     默认是「新帧盖在旧帧上」，所以这里要把旧帧抬到上面来才看得见它收缩。 */
  html[data-vt="out"]::view-transition-old(root){
    z-index:2;
    animation:vt-pull var(--dur-reveal) var(--ease-out) both;
  }
  html[data-vt="out"]::view-transition-new(root){z-index:1}

  @keyframes vt-push{
    from{clip-path:circle(0px at var(--vt-x) var(--vt-y))}
    to{clip-path:circle(var(--vt-r) at var(--vt-x) var(--vt-y))}
  }
  @keyframes vt-pull{
    from{clip-path:circle(var(--vt-r) at var(--vt-x) var(--vt-y))}
    to{clip-path:circle(0px at var(--vt-x) var(--vt-y))}
  }

  /* 快照期间关掉 DOM 自己的配色过渡：否则新帧会拍到过渡中间那一瞬，颜色就不对了。
     快照结束后 .vt 摘掉，退路用的 transition 原样回来。 */
  html.vt,html.vt body,html.vt h1,html.vt h1::after,
  html.vt footer,html.vt #theme-toggle{transition:none}
</style>
</head>
<body>
<main>
  <h1 id="line">正在装修中，你来这里干什么？</h1>
  <footer>这是你第 <span id="n">1</span> 次光临</footer>
</main>

<button id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
  <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
  </svg>
</button>

<script>
  // 文案池：想加就往后追加，改完刷新即可生效
  var COPY = [
"正在装修中，你来这里干什么？" ,
"工地重地，闲人免进。说的就是你" ,
"装修中，灰尘有点大，建议戴个口罩再刷新" ,
"这里还什么都没建好，你是第一个来的，荣幸吗？" ,
"正在装修中。再等等" ,
"页面装修中，进度 3%。刷新不会让它变快" ,
"装修中，请勿在此堆放杂物。你的好奇心除外" ,
"正在装修中，预计 114514 年后完工" ,
"上次看到这句话还是在上一次" ,
"施工重地，请勿围观。你已经在围观了" ,
"装修中，暂时没有内容——不过随机文案也算内容吧..." ,
"这里什么都没有，除了这句话和你的好奇心" ,
"正在装修中。你来这里干什么？我也想知道" ,
"抱歉，本页还在装修。要不你先去别处逛逛？" ,
"啊 我该给你看什么好呢(翻)" ,
"早上好/中午好/晚上好/凌晨好",
"猜猜你要刷新多少次才能再看到这条tip",
"猜猜这是你第几次看到这句话了"
  ];

  var KEY_LAST = "uc:last";
  var KEY_N = "uc:n";

  function store(key, val) {
    try { sessionStorage.setItem(key, val); } catch (e) {}
  }
  function load(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }

  // 随机挑一条，且尽量不跟上次重复
  var last = load(KEY_LAST);
  var pool = COPY.filter(function (t) { return t !== last; });
  if (!pool.length) pool = COPY;
  var pick = pool[Math.floor(Math.random() * pool.length)];

  document.getElementById("line").textContent = pick;
  store(KEY_LAST, pick);

  var visits = Number(load(KEY_N) || 0) + 1;
  store(KEY_N, String(visits));
  document.getElementById("n").textContent = String(visits);
</script>

<script>
  // ── 主题切换：自动跟随系统 + 手动覆盖（手动选择记在 localStorage） ──
  (function () {
    var KEY_THEME = "uc:theme";
    var BG = { light: "#f4f3f1", dark: "#1a1917" };
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");

    function read() {
      try { return localStorage.getItem(KEY_THEME); } catch (e) { return null; }
    }
    function write(v) {
      try {
        if (v) localStorage.setItem(KEY_THEME, v);
        else localStorage.removeItem(KEY_THEME);
      } catch (e) {}
    }
    // 当前实际生效的主题：手动优先，否则看系统
    function effective() {
      var t = root.getAttribute("data-theme");
      if (t === "dark" || t === "light") return t;
      return mq.matches ? "dark" : "light";
    }
    function sync() {
      var dark = effective() === "dark";
      var label = dark ? "切换到浅色模式" : "切换到深色模式";
      btn.setAttribute("aria-label", label);
      btn.setAttribute("title", label + "（按住 Shift 点击=跟随系统）");
      btn.setAttribute("aria-pressed", dark ? "true" : "false");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? BG.dark : BG.light);
    }
    function apply(theme) {
      if (theme) root.setAttribute("data-theme", theme);
      else root.removeAttribute("data-theme");
      sync();
    }

    // ── 主题切换动效：变暗时暗色从按钮处推开，变亮时那层暗色沿原路收回 ──
    var reduceMQ = window.matchMedia("(prefers-reduced-motion: reduce)");
    var live = null;   // 正在跑的那次 View Transition，用来判断该由谁收尾

    function go(theme) {
      // theme: "light" / "dark" / null（null = 清掉手动选择、跟随系统）
      var target = theme || (mq.matches ? "dark" : "light");

      // 减少动效、或浏览器不支持 → 不做推移，直接换色让 CSS transition 去淡
      if (reduceMQ.matches || !document.startViewTransition) { apply(theme); return; }

      var box = btn.getBoundingClientRect();
      var cx = box.left + box.width / 2;
      var cy = box.top + box.height / 2;
      // 半径取到最远那个角的距离，保证圆一定能盖满整个视口
      var r = Math.hypot(Math.max(cx, window.innerWidth - cx),
                         Math.max(cy, window.innerHeight - cy));

      root.style.setProperty("--vt-x", cx + "px");
      root.style.setProperty("--vt-y", cy + "px");
      root.style.setProperty("--vt-r", r + "px");
      root.setAttribute("data-vt", target === "dark" ? "in" : "out");
      root.classList.add("vt");     // 快照期间压掉 DOM 自己的配色过渡

      var t = document.startViewTransition(function () { apply(theme); });
      live = t;
      var done = function () {
        if (live !== t) return;     // 已经被后面那一次点击顶掉，交给它收尾
        live = null;
        root.classList.remove("vt");
        root.removeAttribute("data-vt");
      };
      t.finished.then(done, done);
    }

    btn.addEventListener("click", function (e) {
      // Shift+点击 = 清掉手动选择、恢复跟随系统（同样走一趟推开/收回）
      if (e.shiftKey) { write(null); go(null); return; }
      var next = effective() === "dark" ? "light" : "dark";
      write(next);
      go(next);
    });

    // 用户没手动选过时，系统主题变化要实时跟随
    var onSystemChange = function () { if (!read()) sync(); };
    if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);

    sync();
  })();
</script>
</body>
</html>
